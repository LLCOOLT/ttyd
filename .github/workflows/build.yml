name: Build

# The lint job checks the sources on every push and pull request; it needs no game files.
#
# The build job runs only when started by hand, on main, by the repository owner, on the owner's
# self-hosted runner. The game files never leave that machine: the runner's .env sets TTYD_ORIG to a
# folder holding G8MJ01/, G8ME01/, G8MP01/ and G8ME01_DEMO/, each with that version's extracted
# sys/main.dol and files/rel/ (for the demo: the contents of zz_PaperMario2_game.tgc, i.e. its
# main.dol and its six RELs).
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Version conditions in the game code use include/version.h
      - name: Check version conditions
        run: python tools/check_versions.py -v

      # The same function has the same name in every version's symbols.txt
      - name: Check symbol names across versions
        run: python tools/check_symbols.py

      # Formatting (skipped with a message when the runner has no clang-format 23)
      - name: Check formatting
        run: |
          python tools/format_check.py --self-test
          python tools/format_check.py

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, ttyd]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: [G8MJ01, G8ME01, G8MP01, G8ME01_DEMO]
    defaults:
      run:
        shell: powershell

    steps:
      # Keep build/ between runs so the downloaded build tools are reused
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Clean the workspace (keeping build tools)
        run: git clean -ffdx -e build/tools -e build/compilers -e build/binutils -e .ninja_log

      # Copy the original files from the runner machine
      - name: Prepare
        run: |
          if (-not $env:TTYD_ORIG) { Write-Error "Set TTYD_ORIG in the runner's .env file."; exit 1 }
          $src = Join-Path $env:TTYD_ORIG "${{ matrix.version }}"
          $dst = "orig\${{ matrix.version }}"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "sys"), (Join-Path $src "files") $dst

      # Build the project and check it against the original hashes
      - name: Build
        run: |
          python configure.py --map --version ${{ matrix.version }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ninja
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ninja progress build/${{ matrix.version }}/report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Upload map files
      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_maps
          path: build/${{ matrix.version }}/**/*.MAP

      # Upload progress report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
