name: Build

on:
  # Manual runs only. The game files are not part of this repository: the run downloads them from
  # the URL in the ORIG_ARCHIVE_URL repository secret (an archive with orig/G8MJ01/ and
  # orig/G8ME01/, each holding that version's disc image).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [G8MJ01, G8ME01]

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ninja
        run: pip install ninja

      # Fetch the original game files
      - name: Prepare
        env:
          ORIG_ARCHIVE_URL: ${{ secrets.ORIG_ARCHIVE_URL }}
        run: |
          if [ -z "$ORIG_ARCHIVE_URL" ]; then
            echo "::error::Set the ORIG_ARCHIVE_URL repository secret to an archive of the orig/ disc images."
            exit 1
          fi
          curl -fsSL "$ORIG_ARCHIVE_URL" -o orig_archive
          case "$(file -b --mime-type orig_archive)" in
            application/zip) unzip -q -o orig_archive ;;
            *) tar -xf orig_archive ;;
          esac
          rm orig_archive
          ls orig/${{ matrix.version }}

      # Cache the downloaded build tools between runs
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            build/compilers
            build/binutils
          key: ${{ runner.os }}-tools-${{ hashFiles('configure.py') }}

      # Build the project and check it against the original hashes
      - name: Build
        run: |
          python configure.py --map --version ${{ matrix.version }}
          ninja
          ninja progress build/${{ matrix.version }}/report.json

      # Upload map files
      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_maps
          path: build/${{ matrix.version }}/**/*.MAP

      # Upload progress report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
